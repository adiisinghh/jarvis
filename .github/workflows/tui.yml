name: tui

on:
  push:
    paths:
      - "tui/**"
      - ".github/workflows/tui.yml"
  pull_request:
    paths:
      - "tui/**"
      - ".github/workflows/tui.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: cd tui && bun install
      - run: cd tui && bun test
      - run: cd tui && bun run typecheck
      - run: cd tui && bun run build
